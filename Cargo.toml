[workspace]
resolver = "2"
members = [
    "crates/clawkb-core",
    "crates/clawkb-cli",
    "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["ClawKB Contributors"]
repository = "https://github.com/anthropics/claw-kb"

[workspace.dependencies]
memvid-core = { version = "2.0", features = ["lex", "vec", "pdf_extract", "temporal_track", "parallel_segments", "encryption", "replay", "api_embed"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
clap = { version = "4", features = ["derive"] }
colored = "3"
comfy-table = "7"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
tempfile = "3"
# Document parsing
docx-rs = "0.4"
calamine = "0.26"
zip = "2"
quick-xml = "0.37"
scraper = "0.22"
csv = "1"
memchr = "2"
walkdir = "2"
base64 = "0.22"
